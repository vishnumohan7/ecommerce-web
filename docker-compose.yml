services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: denes, POSTGRES_PASSWORD: denes, POSTGRES_DB: denes }
    ports: ['5432:5432']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U denes'], interval: 5s, timeout: 3s, retries: 10 }
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 10 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: denes, MINIO_ROOT_PASSWORD: denes-development }
    ports: ['9000:9000', '9001:9001']
    healthcheck: { test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live'], interval: 5s, timeout: 3s, retries: 10 }
    volumes: [minio-data:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
    healthcheck: { test: ['CMD', '/mailpit', 'readyz'], interval: 5s, timeout: 3s, retries: 10 }
  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment: { MEILI_MASTER_KEY: denes-development }
    ports: ['7700:7700']
    healthcheck: { test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://localhost:7700/health'], interval: 5s, timeout: 3s, retries: 10 }
volumes: { postgres-data: {}, minio-data: {} }
